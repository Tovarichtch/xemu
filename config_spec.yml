general:
  show_welcome:
    type: bool
    default: true
  updates:
    check:
      type: bool
      default: false
  screenshot_dir: string
  games_dir: string
  skip_boot_anim: bool
  # throttle_io: bool
  last_viewed_menu_index: integer
  user_token: string
  snapshots:
    shortcuts:
      f5: string
      f6: string
      f7: string
      f8: string
    filter_current_game: bool

input:
  bindings:
    port1_driver: string
    port1: string
    port2_driver: string
    port2: string
    port3_driver: string
    port3: string
    port4_driver: string
    port4: string
  peripherals:
    port1:
      peripheral_type_0: integer
      peripheral_param_0: string
      peripheral_type_1: integer
      peripheral_param_1: string
    port2:
      peripheral_type_0: integer
      peripheral_param_0: string
      peripheral_type_1: integer
      peripheral_param_1: string
    port3:
      peripheral_type_0: integer
      peripheral_param_0: string
      peripheral_type_1: integer
      peripheral_param_1: string
    port4:
      peripheral_type_0: integer
      peripheral_param_0: string
      peripheral_type_1: integer
      peripheral_param_1: string
  gamecontrollerdb_path: string
  auto_bind:
    type: bool
    default: true
  # Deprecated: use 'enable_rumble' on the controller mapping settings instead
  allow_vibration:
    type: bool
    default: true
  background_input_capture: bool
  keyboard_controller_scancode_map:
    # Scancode reference : https://github.com/libsdl-org/SDL/blob/main/include/SDL_scancode.h
    a:
      type: integer
      default: 4 # a
    b:
      type: integer
      default: 5 # b
    x:
      type: integer
      default: 27 # x
    y:
      type: integer
      default: 28 # y
    dpad_left:
      type: integer
      default: 80 # left
    dpad_up:
      type: integer
      default: 82 # up
    dpad_right:
      type: integer
      default: 79 # right
    dpad_down:
      type: integer
      default: 81 # down
    back:
      type: integer
      default: 42 # backspace
    start:
      type: integer
      default: 40 # return
    white:
      type: integer
      default: 30 # 1
    black:
      type: integer
      default: 31 # 2
    lstick_btn:
      type: integer
      default: 32 # 3
    rstick_btn:
      type: integer
      default: 33 # 4
    guide:
      type: integer
      default: 34 # 5
    lstick_up:
      type: integer
      default: 8 # e
    lstick_left:
      type: integer
      default: 22 # s
    lstick_right:
      type: integer
      default: 9 # f
    lstick_down:
      type: integer
      default: 7 # d
    ltrigger:
      type: integer
      default: 26 # w
    rstick_up:
      type: integer
      default: 12 # i
    rstick_left:
      type: integer
      default: 13 # j
    rstick_right:
      type: integer
      default: 15 # l
    rstick_down:
      type: integer
      default: 14 # k
    rtrigger:
      type: integer
      default: 18 # w
  gamepad_mappings:
    type: array
    items:
      gamepad_id: string
      enable_rumble:
        type: bool
        default: true
      # steel_battalion_mapping:
      # ...
      controller_mapping:
        a:
          type: integer
          default: 0
        b:
          type: integer
          default: 1
        x:
          type: integer
          default: 2
        y:
          type: integer
          default: 3
        back:
          type: integer
          default: 4
        guide:
          type: integer
          default: 5
        start:
          type: integer
          default: 6
        lstick_btn:
          type: integer
          default: 7
        rstick_btn:
          type: integer
          default: 8
        lshoulder:
          type: integer
          default: 9
        rshoulder:
          type: integer
          default: 10
        dpad_up:
          type: integer
          default: 11
        dpad_down:
          type: integer
          default: 12
        dpad_left:
          type: integer
          default: 13
        dpad_right:
          type: integer
          default: 14
        axis_left_x:
          type: integer
          default: 0
        axis_left_y:
          type: integer
          default: 1
        axis_right_x:
          type: integer
          default: 2
        axis_right_y:
          type: integer
          default: 3
        axis_trigger_left:
          type: integer
          default: 4
        axis_trigger_right:
          type: integer
          default: 5
        invert_axis_left_x:
          type: bool
          default: false
        invert_axis_left_y:
          type: bool
          default: false
        invert_axis_right_x:
          type: bool
          default: false
        invert_axis_right_y:
          type: bool
          default: false

display:
  renderer:
    type: enum
    values: ["NULL", OPENGL, VULKAN]
    default: OPENGL
  vulkan:
    validation_layers: bool
    debug_shaders: bool
    assert_on_validation_msg: bool
    preferred_physical_device: string
  quality:
    surface_scale:
      type: integer
      default: 1
  filtering:
    type: enum
    values: [linear, nearest]
    default: linear
  crt_gamma:
    type: number
    default: 1.0
  window:
    fullscreen_on_startup: bool
    fullscreen_exclusive: bool
    startup_size:
      type: enum
      values: [last_used, 640x480, 720x480, 1280x720, 1280x800, 1280x960, 1920x1080, 2560x1440, 2560x1600, 2560x1920, 3840x2160]
      default: 1280x960
    last_width:
      type: integer
      default: 640
    last_height:
      type: integer
      default: 480
    vsync:
      type: bool
      default: true
  ui:
    show_menubar:
      type: bool
      default: true
    show_notifications:
      type: bool
      default: true
    hide_cursor:
      type: bool
      default: true
    use_animations:
      type: bool
      default: true
    fit:
      type: enum
      values: [center, scale, stretch]
      default: scale
    aspect_ratio:
      type: enum
      values: [native, auto, 4x3, 16x9]
      default: auto
    scale:
      type: integer
      default: 1
    auto_scale:
      type: bool
      default: true
  debug:
    video:
      transparency:
        type: bool
        default: false
      x_pos:
        type: number
        default: 100.0
      y_pos:
        type: number
        default: 100.0
      x_winsize:
        type: number
        default: 600.0
      y_winsize:
        type: number
        default: 150.0
      advanced_tree_state:
        type: bool
        default: false
  setup_nvidia_profile:
    type: bool
    default: true

audio:
  vp:
    num_workers:
      type: integer
      default: 0  # 0 = auto
  use_dsp: bool
  hrtf:
    type: bool
    default: true
  volume_limit:
    type: number
    default: 1

net:
  enable: bool
  backend:
    type: enum
    values: [nat, udp, pcap]
    default: nat
  pcap:
    netif: string
  udp:
    bind_addr:
      type: string
      default: 0.0.0.0:9368
    remote_addr:
      type: string
      default: 1.2.3.4:9368
  nat:
    forward_ports:
      type: array
      items:
        host: integer
        guest: integer
        protocol:
          type: enum
          values: [tcp, udp]
          default: tcp

sys:
  # The machine that boots when no image is loaded: the last game's, the
  # Xbox dashboard, or SEGABOOT waiting for a game. With an image loaded,
  # the image decides (Xbox disc = Xbox, anything else = Chihiro).
  default_machine:
    type: enum
    values: [auto, xbox, chihiro]
    default: auto
  # The machine last booted, for default_machine = auto.
  last_machine:
    type: enum
    values: [xbox, chihiro]
    default: xbox
  mem_limit:
    type: enum
    values: ['64', '128']
    default: '64'
  avpack:
    type: enum
    values: [scart, hdtv, vga, rfu, svideo, composite, none]
    default: hdtv
  files:
    bootrom_path: string
    flashrom_path: string
    eeprom_path: string
    hdd_path: string
    dvd_path: string

perf:
  hard_fpu:
    type: bool
    default: true
  cache_shaders:
    type: bool
    default: true

chihiro:
  jvs:
    profile:
      type: enum
      values: [hotd3, vc3, gs, ctx, or2, ok, wmmt2, gundam]
      default: hotd3
    # Pointer: "mouse" = system cursor, "" = none, else the identity of a
    # pointer device (chihiro.settings.pointer_devices)
    pointer_device:
      type: string
      default: mouse
    crosshair_path:
      type: string
      default: ""
    crosshair_scale:
      type: integer
      default: 100
    # System keys, shared by every game
    start:
      type: integer
      default: 40
    service:
      type: integer
      default: 38
    coin:
      type: integer
      default: 34
    test:
      type: integer
      default: 39
    # Driving keys, shared by Crazy Taxi and OutRun 2 (a wheel or a pad)
    steer_left:
      type: integer
      default: 80
    steer_right:
      type: integer
      default: 79
    gas:
      type: integer
      default: 82
    brake:
      type: integer
      default: 81
    hotd3:
      trigger:
        type: integer
        default: 1001
      body_button:
        type: integer
        default: 1003
    vc3:
      trigger:
        type: integer
        default: 1001
      body_button:
        type: integer
        default: 1003
      pedal:
        type: integer
        default: 44
      reload:
        type: integer
        default: 0
    gs:
      trigger:
        type: integer
        default: 1001
      body_button:
        type: integer
        default: 1003
      change:
        type: integer
        default: 44
      reload:
        type: integer
        default: 0
      # The card slot: one press pushes the card in hand (or a blank one
      # when none is chosen) into it; the game ejects it.
      card:
        type: integer
        default: 6
    ctx:
      drive_gear:
        type: integer
        default: 225
      reverse:
        type: integer
        default: 224
      jump:
        type: integer
        default: 44
    or2:
      gear_up:
        type: integer
        default: 29
      gear_down:
        type: integer
        default: 27
      view_change:
        type: integer
        default: 224
    # Maximum Tune reads its shifter and its two wheel buttons from the
    # SECOND switch byte of player 1 (V322.xbe 0x00055950 and 0x000559B0):
    # bits 4/5 are the shifter's up/down gate, bits 7/6 its left/right one,
    # and bits 1/0 the two buttons.
    wmmt2:
      shift_up:
        type: integer
        default: 26
      shift_down:
        type: integer
        default: 22
      shift_left:
        type: integer
        default: 4
      shift_right:
        type: integer
        default: 7
      view_change:
        type: integer
        default: 224
      intrude_change:
        type: integer
        default: 225
      # The card slot, which the game's first screen asks for: one press
      # pushes the card in hand (or a blank one) into the reader's mouth,
      # a second press takes it back before the reader draws it in.
      card:
        type: integer
        default: 6
    ok:
      swing_left:
        type: integer
        default: 80
      swing_right:
        type: integer
        default: 79
      board_front:
        type: integer
        default: 82
      board_rear:
        type: integer
        default: 81
      left_grab:
        type: integer
        default: 29
      right_grab:
        type: integer
        default: 27
    # Gundam Battle Operating Simulator's twin-stick cockpit, named as its
    # INPUT TEST names it. Keyboard: W A S D + Q E left, the arrows + right
    # Shift and Ctrl right, Space the pedal.
    gundam:
      l_up:
        type: integer
        default: 26
      l_down:
        type: integer
        default: 22
      l_left:
        type: integer
        default: 4
      l_right:
        type: integer
        default: 7
      l_trigger:
        type: integer
        default: 20
      l_button:
        type: integer
        default: 8
      r_up:
        type: integer
        default: 82
      r_down:
        type: integer
        default: 81
      r_left:
        type: integer
        default: 80
      r_right:
        type: integer
        default: 79
      r_trigger:
        type: integer
        default: 229
      r_button:
        type: integer
        default: 228
      pedal:
        type: integer
        default: 44
      # The card slot's insertion switch (INPUT TEST: CARD IN). One press
      # pushes the card in hand (or a blank one) in; the game ejects it.
      card:
        type: integer
        default: 6
  jvs_p2:
    pointer_device:
      type: string
      default: ""
    crosshair_path:
      type: string
      default: ""
    crosshair_scale:
      type: integer
      default: 100
    start:
      type: integer
      default: 0
    coin:
      type: integer
      default: 0
    hotd3_trigger:
      type: integer
      default: 0
    hotd3_body_button:
      type: integer
      default: 0
    vc3_trigger:
      type: integer
      default: 0
    vc3_body_button:
      type: integer
      default: 0
    vc3_pedal:
      type: integer
      default: 0
    vc3_reload:
      type: integer
      default: 0
    gs_trigger:
      type: integer
      default: 0
    gs_body_button:
      type: integer
      default: 0
    gs_change:
      type: integer
      default: 0
    gs_reload:
      type: integer
      default: 0
    # Player 2's card slot at a Ghost Squad cabinet (V), as player 1's.
    gs_card:
      type: integer
      default: 25
  settings:
    lightgun_mode:
      type: bool
      default: false
    freeplay:
      type: bool
      default: false
    # The preferred region, the byte SEGABOOT reads at EEPROM 0x1F00 (the enum
    # index: 1 Japan, 2 USA, 3 Export); a game outside its boot.id mask (0x38)
    # would stop on Error 05, so it gets the first of Export, USA and Japan it
    # accepts. 'auto' is Export's older name.
    region:
      type: enum
      values: [auto, jp, us, ex]
      default: ex
    # The media board's DIMM: the JP1/JP2 jumper value (the enum index), for
    # the host side and the board's own SPD alike (a mismatch is SEGABOOT's
    # Caution 53). Gundam's 603 MB image needs 1024 MB.
    dimm_size:
      type: enum
      values: ['128', '256', '512', '1024', 'auto']
      default: 'auto'
    # Which media board the machine presents; Auto follows the cabinet table.
    board_type:
      type: enum
      values: [auto, type1, type3]
      default: auto
    force_feedback:
      type: bool
      default: false
    # Drive-board force-feedback strength, percent. Scales both gamepad rumble
    # and steering-wheel haptic effects (OutRun 2). 0 = off.
    ffb_strength:
      type: integer
      default: 100
    # Flip force-feedback direction. Off is correct on Linux and the standard case;
    # enable if the wheel is driven away from center instead of toward it (some
    # wheels/drivers on Windows or macOS invert the FFB polarity).
    ffb_invert:
      type: bool
      default: false
    # How heavy the wheel turns while a game drives it: the damping the
    # Maximum Tune drive board asks for, as a share of the wheel's own damper,
    # percent. Heavy without hiding the knocks on a geared wheel by default; a
    # stronger wheel can take more.
    wheel_weight:
      type: integer
      default: 40
    # Degrees of physical wheel rotation that reach full in-game lock (Sega Rally
    # Model 2 wrapper convention). Default 270 = a 270 deg turn covers the game's
    # whole steering range (OutRun 2 cabinet). 0 = "Full range": the whole wheel
    # maps 1:1. Software scaling assuming a 900 deg wheel.
    wheel_rotation:
      type: integer
      default: 270
    # Spring the wheel back to centre while the game is not driving force
    # feedback. Arcade wheel cabs centre mechanically (Crazy Taxi HR has no FFB
    # hardware at all), so a limp FFB wheel is less faithful than this.
    wheel_autocenter:
      type: bool
      default: true
    wheel_autocenter_strength:
      type: integer
      default: 50
    # Read each mouse or light gun on its own (evdev on Linux, Raw Input on
    # Windows) so two players can aim with their own device. Off: the system
    # cursor aims.
    pointer_devices:
      type: bool
      default: false
    # Exclusive grab of the devices aimed with while playing (Linux)
    pointer_grab:
      type: bool
      default: true
    sinden_border:
      type: bool
      default: false
    sinden_border_style:
      type: enum
      values: [game, fullscreen]
      default: game
    sinden_border_size:
      type: integer
      default: 2
  link:
    # Linked cabinets share a private Ethernet between xemu instances. The
    # host cabinet listens once per other cabinet, on port + that cabinet's
    # number, and relays every frame; the others connect to it. The game's
    # own cabinet number is written into its backup for the titles whose
    # layout is known (Ollie King, OutRun 2, OutRun 2 SP, Maximum Tune).
    enable: bool
    cabinets:
      type: integer
      default: 2
    cabinet:
      type: integer
      default: 1
    host:
      type: string
      default: ""
    port:
      type: integer
      default: 9100
  card_reader:
    # Answer the cabinet's card reader; each reader has its own slots.
    enable:
      type: bool
      default: true
    # Tamura (SAXA) HW210, two slots: Ghost Squad. Gundam Battle Operating
    # Simulator carries one reader of the same family on the same wire, but
    # it takes Banpresto cards, not Sega ones, so its card has its own slot.
    hw210:
      slot1:
        type: string
        default: ""
      slot2:
        type: string
        default: ""
      gundam:
        type: string
        default: ""
    # Sanwa CRP-1231LR-10NAB: Maximum Tune 1 and 2 share the reader, not
    # the card, so each game has its own slot.
    crp1231:
      mt1:
        type: string
        default: ""
      mt2:
        type: string
        default: ""
    # The names the HW210 slots had before the readers were told apart. Moved
    # into hw210 above on the first run and left empty.
    card1_path:
      type: string
      default: ""
    card2_path:
      type: string
      default: ""
  roms:
    bios_path:
      type: string
      default: ""
    mediaboard_path:
      type: string
      default: ""
    ic10_path:
      type: string
      default: ""
    ic11_path:
      type: string
      default: ""
    pc20_path:
      type: string
      default: ""
    # OPTIONAL: the DIMM board's network firmware (Au1500, VxWorks). Linked
    # cabinets run it on the network board. The version the board reports is
    # read from it: the word after "FIRM_VERSION is here!", 0x13050621 = 13.05
    # in ver1305.bin. Network titles check it (OutRun 2 SP 11.01, MJ2 12.06,
    # MJ3 13.05, Gundam 12.09 or 13.09 and later). Empty: 3.17.
    net_firmware_path:
      type: string
      default: ""
    # The qcow2 that holds the Chihiro VM snapshots. Empty: chihiro_snapshots.qcow2
    # in the data directory, created when missing.
    snapshot_store_path:
      type: string
      default: ""
